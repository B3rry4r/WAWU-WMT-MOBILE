<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><script src="./ds-base.js"></script><style>html,body{margin:0;background:#E9E7EC !important;color:#111018;font-family:"Alan Sans",sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#9411C9}a:hover{color:#810FAF}</style></helmet>
<div style="padding:90px 90px 160px;display:flex;flex-direction:column;gap:80px;width:max-content;min-width:100vw"><div style="display:flex;flex-direction:column;gap:14px;max-width:960px"><div style="display:flex;align-items:center;gap:12px"><img src="_ds/wawu/assets/wawu-icon-purple.png" style="width:40px"><div style="font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9411C9">Who Made This? · Flix movies</div></div><h1 style="margin:0;font-size:64px;font-weight:700;letter-spacing:-0.045em;color:#111018;line-height:1">Flix movies</h1><div style="font-size:17px;color:#5A5766;line-height:1.5">12 screens. Dark on top, light underneath. Catalog from the Flixora partner API; playback on Flixora.</div></div><div style="display:flex;gap:10px;flex-wrap:wrap;max-width:1400px"><sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="2"><span onClick="{{ tb.go }}" style="height:40px;padding:0 18px;border-radius:999px;background:{{ tb.bg }};color:{{ tb.fg }};font-size:14.5px;font-weight:700;display:grid;place-items:center;cursor:pointer">{{ tb.label }}</span></sc-for></div><div ref="{{ host }}" style="display:flex;flex-direction:column;gap:140px"></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static NAMES = ["Start here","Flix movies MV1–MV12"];
  state = { sec: 1 };
  host = React.createRef();
  componentDidMount() { fetch('./' + `Flix Movies Flow.sections.json`.replace(/ /g, '%20')).then((r) => r.json()).then((s) => { Component.SECS = s; this.paint(); }); this.paint(); }
  componentDidUpdate() { this.paint(); }
  paint() { const el = this.host.current; if (!el || !Component.SECS || el.dataset.done) return; el.dataset.done = '1'; el.innerHTML = Component.SECS.map((_, i) => '<div data-slot="' + i + '" style="min-height:1400px"></div>').join(''); const fill = (d) => { if (d.dataset.filled) return; d.dataset.filled = '1'; d.innerHTML = Component.SECS[Number(d.dataset.slot)]; d.style.minHeight = ''; }; const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { fill(e.target); io.unobserve(e.target); } }), { rootMargin: '1200px' }); [...el.children].forEach((d, i) => { if (i === 0) fill(d); else io.observe(d); }); this.fill = fill; el.addEventListener('click', (e) => { const a = e.target.closest('a[href^="#"]'); if (!a) return; e.preventDefault(); [...el.children].forEach(fill); const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) { const r = t.getBoundingClientRect(); window.scrollTo({ top: r.top + window.scrollY - 40, left: Math.max(0, r.left + window.scrollX - 90), behavior: 'auto' }); } }); }
  go(i) { const el = this.host.current; const s = el && el.children[i]; if (s && this.fill) { for (let j = 0; j <= i; j++) this.fill(el.children[j]); } if (s) { const y = s.getBoundingClientRect().top + window.scrollY - 40; window.scrollTo({ top: y, behavior: 'auto' }); } }
  renderVals() {
    const sec = this.state.sec;
    return { host: this.host, tabs: Component.NAMES.map((label, i) => ({ label, bg: '#FFFFFF', fg: '#111018', go: () => this.go(i) })) };
  }
}
</script>
</body>
</html>
