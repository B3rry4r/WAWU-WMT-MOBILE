<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static NAMES = ["Wallet","Home","Inbox","Explore","Me","Services","Professionals","Schools","Events","Auth and KYC","Settings","Verify","Points","Referral"];
  static URLS = ["_ds/wawu/assets/wawu-icon-white.png","_ds/wawu/assets/wawu-icon-purple.png","_ds/wawu/assets/mock/p2.jpg","_ds/wawu/assets/mock/w1.jpg","_ds/wawu/assets/mock/c1.jpg","_ds/wawu/assets/mock/w3.jpg","_ds/wawu/assets/mock/e2.jpg","_ds/wawu/assets/mock/w5.jpg","_ds/wawu/assets/mock/p1.jpg","_ds/wawu/assets/mock/p3.jpg","_ds/wawu/assets/mock/w4.jpg","_ds/wawu/assets/mock/w6.jpg","_ds/wawu/assets/mock/e1.jpg","_ds/wawu/assets/mock/p5.jpg","https://cdn.simpleicons.org/instagram","https://cdn.simpleicons.org/tiktok","https://cdn.simpleicons.org/youtube","https://cdn.simpleicons.org/x","_ds/wawu/assets/mock/w2.jpg","_ds/wawu/assets/mock/e3.jpg","https://cdn.simpleicons.org/threads","https://cdn.simpleicons.org/facebook","_ds/wawu/assets/wawu-logo-white.png"];
  static STARTS = [0,13,19,26,29,34,38,41,43,46,51,53,55,57];
  host = React.createRef();
  componentDidMount() { const R = window.__resources || {}; fetch(R.sections || './wawu-light.sections.json').then((r) => r.json()).then((s) => { Component.SECS = s.map((x) => { x = x.split('https://cdn.simpleicons.org/linkedin').join("data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23888'/%3E%3Ctext x='12' y='17' text-anchor='middle' font-family='Arial' font-weight='700' font-size='13' fill='%23fff'%3Ein%3C/text%3E%3C/svg%3E"); x = x.replace(/(-webkit-)?backdrop-filter:[^;"]+;?/g, ''); Component.URLS.forEach((u, i) => { if (R['a' + i]) x = x.split(u).join(R['a' + i]); }); return x.split('content-visibility:auto;').join(''); }); this.paint(); }); }
  componentDidUpdate() { this.paint(); }
  componentWillUnmount() { clearInterval(this.poll); }
  paint() { const el = this.host.current; if (!el || !Component.SECS || el.dataset.done) return; el.dataset.done = '1'; el.innerHTML = Component.SECS.map((_, i) => '<div data-slot="' + i + '" style="min-height:1200px"></div>').join(''); const fill = (d) => { if (d.dataset.filled) return; d.dataset.filled = '1'; d.innerHTML = Component.SECS[Number(d.dataset.slot)]; d.style.minHeight = ''; }; const kids = [...el.children]; fill(kids[0]); const vis = () => { const H = window.innerHeight, Wd = window.innerWidth; for (const d of kids) { if (d.dataset.filled) continue; const r = d.getBoundingClientRect(); if (r.bottom > -H * 1.5 && r.top < H * 2.5 && r.right > -Wd && r.left < Wd * 2) { fill(d); break; } } }; this.poll = setInterval(vis, 250); this.fill = fill; el.addEventListener('click', (e) => { const a = e.target.closest('a[href^="#"]'); if (!a || a.getAttribute('href') === '#') return; e.preventDefault(); const id = a.getAttribute('href').slice(1); const slot = Component.SECS.findIndex((s) => s.includes('id="' + id + '"')); if (slot < 0) return; for (let j = 0; j <= slot; j++) fill(el.children[j]); const t = document.getElementById(id); if (t) { const r = t.getBoundingClientRect(); window.scrollTo({ top: r.top + window.scrollY - 40, left: Math.max(0, r.left + window.scrollX - 90), behavior: 'auto' }); } }); }
  go(i) { const el = this.host.current; if (!el || !this.fill) return; const k = Component.STARTS[i]; for (let j = 0; j <= k; j++) this.fill(el.children[j]); const s = el.children[k]; const y = s.getBoundingClientRect().top + window.scrollY - 40; window.scrollTo({ top: y, left: 0, behavior: 'auto' }); }
  renderVals() { return { host: this.host, tabs: Component.NAMES.map((label, i) => ({ label, go: () => this.go(i) })) }; }
}
