:root{--surface-page:#0B0A0D;--surface-card:#16151B;--surface-sunken:#221F29;--surface-elevated:#1F1D26;
--border-hairline:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.15);--text-primary:#F4F2F7;
--text-secondary:#A9A5B4;--text-muted:#75717F;--accent:#9411C9;--accent-fg:#C368EA;--accent-tint:rgba(195,104,234,.14);
--positive:#3DD68C;--positive-tint:rgba(61,214,140,.12);--warning:#FFB347;--warning-tint:rgba(255,179,71,.14);
--danger:#FF6B6B;--danger-tint:rgba(255,107,107,.14);--info:#5BC8FF;--info-tint:rgba(91,200,255,.14);
--hue-sky:#5BC8FF;--hue-coral:#FF7A6B;--on-accent:#fff;--glow:rgba(148,17,201,.35);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--surface-page:#F6F5F8;--surface-card:#FFFFFF;
--surface-sunken:#EEECF2;--surface-elevated:#FFFFFF;--border-hairline:rgba(17,16,24,.07);--border-strong:rgba(17,16,24,.14);
--text-primary:#111018;--text-secondary:#5A5766;--text-muted:#8C8997;--accent-fg:#9411C9;--accent-tint:rgba(148,17,201,.10);
--positive:#12925A;--positive-tint:rgba(18,146,90,.10);--warning:#C77700;--warning-tint:rgba(199,119,0,.10);
--danger:#D93A3A;--danger-tint:rgba(217,58,58,.10);--info:#0E7FB8;--info-tint:rgba(14,127,184,.10);
--hue-sky:#0E7FB8;--hue-coral:#D9503F;--glow:rgba(148,17,201,.18);color-scheme:light}}
:root[data-theme="light"]{--surface-page:#F6F5F8;--surface-card:#FFFFFF;--surface-sunken:#EEECF2;--surface-elevated:#FFFFFF;
--border-hairline:rgba(17,16,24,.07);--border-strong:rgba(17,16,24,.14);--text-primary:#111018;--text-secondary:#5A5766;
--text-muted:#8C8997;--accent-fg:#9411C9;--accent-tint:rgba(148,17,201,.10);--positive:#12925A;--positive-tint:rgba(18,146,90,.10);
--warning:#C77700;--warning-tint:rgba(199,119,0,.10);--danger:#D93A3A;--danger-tint:rgba(217,58,58,.10);--info:#0E7FB8;

*{box-sizing:border-box}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font:400 15px/1.45 "Alan Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-feature-settings:"tnum" 1,"lnum" 1}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:22px}
h1,h2,h3{margin:0;letter-spacing:-.025em;text-wrap:balance}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:800;font-size:15px;box-shadow:0 6px 18px var(--glow)}
.top h1{font-size:22px;font-weight:750}
.top .sub{color:var(--text-muted);font-size:12.5px;margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{padding:5px 10px;border-radius:999px;background:var(--surface-sunken);color:var(--text-secondary);font-size:12px;font-weight:600}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
.card{background:var(--surface-card);border-radius:22px;box-shadow:inset 0 0 0 1px var(--border-hairline);padding:18px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:112px}
.stat .big{font-size:40px;font-weight:650;letter-spacing:-.045em;line-height:1}
.stat .lbl{color:var(--text-secondary);font-size:13.5px}
.stat.alert .big{color:var(--danger)} .stat.run .big{color:var(--accent-fg)} .stat.wait .big{color:var(--warning)}
.launch{display:flex;align-items:center;gap:18px;background:linear-gradient(150deg,#2A1240,var(--surface-card) 62%)}
:root[data-theme="light"] .launch{background:linear-gradient(150deg,#EFE2F7,#fff 62%)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .launch{background:linear-gradient(150deg,#EFE2F7,#fff 62%)}}
.ringbox{position:relative;width:96px;height:96px;flex:none}
.ring{width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.rt{stroke:var(--surface-sunken)} .rv{stroke:var(--accent)}
.ringbox b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:-.03em}
.launch .lt{display:grid;gap:4px} .launch .lt strong{font-size:18.5px;letter-spacing:-.025em}
.launch .lt span{color:var(--text-secondary);font-size:13.5px}
.needs ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.need{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface-sunken)}
.nn{width:26px;height:26px;border-radius:999px;background:var(--danger-tint);color:var(--danger);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.nt{display:grid;min-width:0;flex:1} .nt b{font-weight:650;font-size:15px} .nt span{color:var(--text-secondary);font-size:13px}
.btn{flex:none;padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:13px;text-decoration:none}
.chains{display:grid;gap:12px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ch h3{font-size:16px;font-weight:650}
.frac{font-size:20px;font-weight:700;letter-spacing:-.03em} .frac span,.af span{color:var(--text-muted);font-weight:500}
.track{height:6px;border-radius:99px;background:var(--surface-sunken);margin:10px 0 16px;overflow:hidden}
.track span{display:block;height:100%;background:var(--positive);border-radius:99px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:0}
.step{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;gap:6px;padding-right:10px}
.step:not(:last-child)::after{content:"";position:absolute;left:30px;right:0;top:15px;height:2px;background:var(--border-strong)}
.node{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.node.sm{flex-direction:row;align-items:center;gap:8px}
.dot{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg);flex:none;background-clip:padding-box}
.node.sm .dot{width:26px;height:26px}
.node.live .dot{box-shadow:inset 0 0 0 2px var(--fg),0 0 0 4px var(--bg)}
.ntext{display:grid;min-width:0}
.nid{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--fg)}
.nl{font-size:13.5px;font-weight:600;line-height:1.25}
.nnote{font-size:12px;color:var(--text-muted)}
.par{gap:8px;padding-top:0}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--surface-card);border-radius:20px;box-shadow:inset 0 0 0 1px var(--border-hairline);padding:12px}
.col header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cdot{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;background:var(--bg);color:var(--fg)}
.col h3{font-size:13.5px;font-weight:650;flex:1}
.count{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--surface-sunken);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text-secondary)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{position:relative;display:grid;gap:3px;padding:10px 34px 10px 11px;border-radius:14px;background:var(--surface-sunken);box-shadow:inset 3px 0 0 var(--fg)}
.tid{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text-muted)}
.tl{font-size:13.5px;font-weight:600;line-height:1.25}
.tnote{font-size:12px;color:var(--danger)}
.new{position:absolute;top:9px;right:34px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-fg)}
.who{position:absolute;right:9px;top:9px;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--h);color:#111018}
.empty{color:var(--text-muted);font-size:13px;padding:6px 2px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.news ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
.news li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:9px 0 9px 16px;position:relative;font-size:13.5px}
.news li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:8px;border-radius:99px;background:var(--k)}
.news li::after{content:"";position:absolute;left:3.5px;top:27px;bottom:-9px;width:1px;background:var(--border-strong)}
.news li:last-child::after{display:none}
.news time{color:var(--text-muted);font-size:12px;padding-top:1px}
.areas ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 18px}
.areas li{display:grid;grid-template-columns:92px 1fr 46px;align-items:center;gap:10px;font-size:13px}
.an{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--surface-sunken);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.af{text-align:right;font-weight:650}
.done ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.done li{display:flex;gap:7px;align-items:center;padding:6px 11px;border-radius:999px;background:var(--positive-tint);font-size:12.5px;font-weight:600}
.done .tid{color:var(--positive)}
.pill{padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--fg);font-size:11.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:1040px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:repeat(3,minmax(0,1fr))}.launch{grid-column:1/-1}}
@media (max-width:760px){
.duo{grid-template-columns:1fr}.areas ul{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}
.steps{flex-direction:column;gap:12px}.step{padding:0 0 0 0}
.step:not(:last-child)::after{left:15px;right:auto;top:34px;bottom:-12px;width:2px;height:auto}
.node{flex-direction:row;align-items:center;gap:12px}.par{padding-left:42px}
}
@media (max-width:520px){.board{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr}.stat .big{font-size:32px}.top .sub{margin-left:0}}
</style>
